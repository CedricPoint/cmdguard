name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  guard:
    name: guard its own commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node bin/cmdguard.js check "npm ci && npm test"
      - name: a destructive command must be refused
        run: |
          if node bin/cmdguard.js check --quiet "rm -rf /"; then
            echo "cmdguard allowed rm -rf /" && exit 1
          fi
